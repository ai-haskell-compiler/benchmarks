name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Python tests
        run: nix develop --command python3 -m unittest discover -s tests -v
      - name: Validate browser JavaScript
        if: runner.os == 'Linux'
        run: node --check site/app.js
      - name: Build static site
        if: runner.os == 'Linux'
        run: python3 scripts/build-site.py
