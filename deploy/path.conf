[Service]
# A systemd user service does not source login profiles, so nix is only on
# PATH if the user manager happened to inherit it from the session that
# started the unit. After a reboot it does not: worker-desktop came back on
# 2026-09-20 and the window died with "nix: command not found" (exit 127).
Environment=PATH=/nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
